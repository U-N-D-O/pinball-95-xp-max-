name: Windows build validation

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 30

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.4'
          cache: true

      - name: Enable Windows desktop
        run: flutter config --enable-windows-desktop

      - name: Analyze and test
        working-directory: game_app
        run: |
          flutter pub get
          flutter analyze
          flutter test

      - name: Build Windows release
        working-directory: game_app
        run: flutter build windows --release

      - name: Confirm release executable
        working-directory: game_app
        shell: pwsh
        run: |
          $exe = Get-Item -LiteralPath 'build/windows/x64/runner/Release/pinball_neo_95.exe'
          if ($exe.Length -le 0) {
            throw 'Windows release executable is empty.'
          }
          Write-Output "Windows release executable: $($exe.Length) bytes"
